name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Node backs the dashboard render assertions; the annotation below
      # reports whether it was present, so a runner without it cannot
      # silently shrink the suite.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install httpx
        run: python -m pip install httpx
      - name: Run the test suite
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -t . > suite-output.txt 2>&1
          status=$?
          cat suite-output.txt
          skipped=$(grep -oE 'skipped=[0-9]+' suite-output.txt | tail -n 1)
          echo "::notice title=test-suite::exit=${status} ${skipped:-skipped=unknown} node=$(node --version 2>/dev/null || echo missing)"
          exit ${status}

  test-without-httpx:
    name: test (stdlib only, no httpx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Nothing is installed on purpose: the core must run on the standard
      # library alone. The streaming tests that need httpx skip here.
      - name: Run the test suite without third-party packages
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -t . > suite-output.txt 2>&1
          status=$?
          cat suite-output.txt
          skipped=$(grep -oE 'skipped=[0-9]+' suite-output.txt | tail -n 1)
          echo "::notice title=test-suite-stdlib::exit=${status} ${skipped:-skipped=unknown} node=$(node --version 2>/dev/null || echo missing)"
          exit ${status}

  package:
    name: package (build, sdist suite, wheel install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build tools
        run: python -m pip install build httpx
      - name: Build the sdist and wheel
        run: python -m build
      - name: Run the suite from the extracted sdist
        shell: bash
        run: |
          mkdir -p /tmp/sdist
          tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/gemini-web2api-*/
          set +e
          python -m unittest discover -s tests -t . > /tmp/sdist-suite.txt 2>&1
          status=$?
          cat /tmp/sdist-suite.txt
          ran=$(grep -oE 'Ran [0-9]+ tests' /tmp/sdist-suite.txt | tail -n 1 | grep -oE '[0-9]+$')
          expected=$(grep -oE '[0-9]+ tests' "$GITHUB_WORKSPACE/README.md" | head -n 1 | grep -oE '[0-9]+$')
          echo "::notice title=sdist-suite::exit=${status} ran=${ran:-none} expected=${expected:-none}"
          if [ "${status}" -ne 0 ]; then exit "${status}"; fi
          if [ "${ran}" != "${expected}" ]; then
            echo "sdist ran ${ran} tests but README.md documents ${expected}" >&2
            exit 1
          fi
      - name: Install the wheel and smoke-test the entry points
        shell: bash
        run: |
          python -m pip install dist/*.whl
          gemini-web2api --version
          python gemini_web2api.py --version

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff
        run: ruff check gemini_web2api.py gemini_web2api tests scripts
      - name: Byte-compile
        run: python -m compileall -q gemini_web2api.py gemini_web2api tests scripts

  docker:
    name: docker (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows:
    name: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Windows executable
        run: python scripts/build_windows.py
      - name: Smoke-test the executable
        shell: pwsh
        run: dist/windows/gemini-web2api/gemini-web2api.exe --version
      - name: Upload the portable archive
        uses: actions/upload-artifact@v4
        with:
          name: gemini-web2api-windows
          path: dist/windows/*.zip
          if-no-files-found: error
