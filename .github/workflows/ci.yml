name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            expected_skips: 7
          - python-version: "3.9"
            expected_skips: 7
          - python-version: "3.10"
            expected_skips: 7
          - python-version: "3.11"
            expected_skips: 0
          - python-version: "3.12"
            expected_skips: 0
          - python-version: "3.13"
            expected_skips: 0
    env:
      EXPECTED_SKIPS: ${{ matrix.expected_skips }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node for dashboard checks
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install optional streaming transport
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        shell: bash
        run: |
          status=0
          python -m unittest discover -s tests -t . -v > unittest.log 2>&1 || status=$?
          cat unittest.log
          skipped=$(python -c 'import re,sys; t=open(sys.argv[1], encoding="utf-8").read(); m=re.search(r"skipped=(\d+)\)", t); print(m.group(1) if m else "0")' unittest.log)
          node_version=$(node --version 2>/dev/null || echo missing)
          if [[ "$skipped" != "$EXPECTED_SKIPS" ]]; then
            echo "::error title=unexpected test skips::expected=$EXPECTED_SKIPS actual=$skipped"
            status=1
          fi
          echo "::notice title=test-suite::exit=$status skipped=$skipped node=$node_version"
          exit $status

  test-without-httpx:
    name: test (standard library only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SKIPS: 11
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node for dashboard checks
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Ensure the optional transport is absent
        run: |
          python -m pip uninstall -y httpx
          python -c "import importlib.util; assert not importlib.util.find_spec('httpx'), 'httpx is still installed'"

      - name: Run test suite without third-party packages
        shell: bash
        run: |
          status=0
          python -m unittest discover -s tests -t . -v > unittest.log 2>&1 || status=$?
          cat unittest.log
          skipped=$(python -c 'import re,sys; t=open(sys.argv[1], encoding="utf-8").read(); m=re.search(r"skipped=(\d+)\)", t); print(m.group(1) if m else "0")' unittest.log)
          node_version=$(node --version 2>/dev/null || echo missing)
          if [[ "$skipped" != "$EXPECTED_SKIPS" ]]; then
            echo "::error title=unexpected test skips::expected=$EXPECTED_SKIPS actual=$skipped"
            status=1
          fi
          echo "::notice title=test-without-httpx::exit=$status skipped=$skipped node=$node_version"
          exit $status

  package:
    name: package and sdist verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node for dashboard checks
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install build tools and optional streaming transport
        run: |
          python -m pip install build
          python -m pip install -r requirements.txt

      - name: Build source distribution and wheel
        run: python -m build

      - name: Run the suite from the extracted source distribution
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"
          status=0
          python -m unittest discover -s tests -t . -v > sdist-test.log 2>&1 || status=$?
          cat sdist-test.log
          expected=$(python -c 'import re; t=open("README.md", encoding="utf-8").read(); m=re.search(r"(\d{2,4})\s*tests", t); print(m.group(1) if m else "0")')
          ran=$(python -c 'import re,sys; t=open(sys.argv[1], encoding="utf-8").read(); m=re.search(r"^Ran (\d+) tests? in ", t, re.M); print(m.group(1) if m else "0")' sdist-test.log)
          skipped=$(python -c 'import re,sys; t=open(sys.argv[1], encoding="utf-8").read(); m=re.search(r"skipped=(\d+)\)", t); print(m.group(1) if m else "0")' sdist-test.log)
          summary=$(python -c 'import sys; t=open(sys.argv[1], encoding="utf-8").read(); lines=[x.strip() for x in t.splitlines() if x.startswith(("Ran ", "OK", "FAILED", "ERROR"))]; print("; ".join(lines[-2:]))' sdist-test.log)
          if [[ "$ran" != "$expected" || "$skipped" != "15" ]]; then
            echo "::error title=sdist coverage mismatch::ran=$ran expected=$expected skipped=$skipped expected-skipped=15"
            status=1
          fi
          echo "::notice title=sdist-suite::exit=$status ran=$ran expected=$expected skipped=$skipped summary=$summary"
          exit $status

      - name: Install wheel and smoke-test entry points
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          mkdir -p "$RUNNER_TEMP/wheel-smoke" "$RUNNER_TEMP/shim-smoke"
          cd "$RUNNER_TEMP/wheel-smoke"
          python -m gemini_web2api --version
          gemini-web2api --version
          cp "$GITHUB_WORKSPACE/gemini_web2api.py" "$RUNNER_TEMP/shim-smoke/"
          cd "$RUNNER_TEMP/shim-smoke"
          python gemini_web2api.py --version

  lint:
    name: lint and compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff>=0.5"

      - name: Lint every Python directory
        run: ruff check gemini_web2api.py gemini_web2api tests scripts

      - name: Compile every Python directory
        run: python -m compileall -q gemini_web2api.py gemini_web2api tests scripts

  docker:
    name: build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (do not publish)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gemini-web2api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows:
    name: build and smoke-test Windows executable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Windows executable
        run: python scripts/build_windows.py --clean

      - name: Check the executable version
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/windows/gemini-web2api/gemini-web2api.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "The executable --version smoke test failed." }

      - name: Start the executable and probe health
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/windows/gemini-web2api/gemini-web2api.exe"
          $port = 18181
          $process = Start-Process -FilePath $exe -ArgumentList @("--no-browser", "--host", "127.0.0.1", "--port", "$port", "--no-auto-bl") -PassThru -NoNewWindow
          $healthy = $false
          $deadline = (Get-Date).AddSeconds(60)
          try {
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "The executable exited before becoming healthy (code $($process.ExitCode))." }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $healthy) { throw "The executable did not answer /health within 60 seconds." }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
