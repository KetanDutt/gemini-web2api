# Standard bridge-network deployment.
#
#   docker compose up -d
#
# Configuration comes from the environment below, so this works without a
# config.json. To use a file instead, uncomment the volumes entry and run
# `cp config.example.json config.json` first — otherwise Docker creates a
# *directory* named config.json and the container fails to read it.
#
# If Gemini rejects requests from Docker's NAT range (empty replies, 403/429),
# use the host-networking variant instead:
#
#   docker compose -f docker-compose.local.yml up -d

services:
  gemini-web2api:
    build: .
    image: gemini-web2api:local
    container_name: gemini-web2api
    restart: unless-stopped
    ports:
      - "${GEMINI_WEB2API_PORT:-8081}:8081"
    environment:
      GEMINI_WEB2API_PORT: "8081"
      GEMINI_WEB2API_HOST: "0.0.0.0"
      # Comma-separated list. Empty means authentication is DISABLED.
      GEMINI_WEB2API_API_KEYS: "${GEMINI_WEB2API_API_KEYS:-}"
      GEMINI_WEB2API_DEFAULT_MODEL: "${GEMINI_WEB2API_DEFAULT_MODEL:-gemini-3.6-flash}"
      GEMINI_WEB2API_LOG_REQUESTS: "${GEMINI_WEB2API_LOG_REQUESTS:-true}"
      GEMINI_WEB2API_TEMPORARY_CHATS: "${GEMINI_WEB2API_TEMPORARY_CHATS:-false}"
      # Set to enable authenticated Pro routing; mount the file below too.
      GEMINI_WEB2API_COOKIE_FILE: "${GEMINI_WEB2API_COOKIE_FILE:-}"
      GEMINI_WEB2API_PROXY: "${GEMINI_WEB2API_PROXY:-}"
      # 0 disables the limiter.
      GEMINI_WEB2API_RATE_LIMIT_MAX: "${GEMINI_WEB2API_RATE_LIMIT_MAX:-0}"
    # volumes:
    #   - ./config.json:/app/config.json:ro
    #   - ./gemini-auth.json:/data/gemini-auth.json:ro
    healthcheck:
      test: ["CMD", "python", "/app/gemini_web2api/_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
